

<h1>Qual é o seu perfil de investidor?</h1>
{% if erro %}<p style="color:#c00">{{ erro }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {% for p in perguntas %}
  <fieldset>
    <legend>{{ forloop.counter }}. {{ p.texto }}</legend>
    {% for op in p.opcoes %}
    <label>
      <input type="radio" name="{{ p.id }}" value="{{ forloop.counter0 }}" required>
      {{ op }}
    </label><br>
    {% endfor %}
  </fieldset>
  {% endfor %}
  <button type="submit">Ver meu perfil</button>
</form>
